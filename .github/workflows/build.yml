name: Build Local Web Streamer APK v3.4 (Single File)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project from this single workflow file
        run: |
          python3 - << 'PY'
          import os, base64
          files = {
              'settings.gradle': '',
              'build.gradle': 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMS40JyBhcHBseSBmYWxzZQp9Cg==',
              'gradle.properties': 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==',
              'app/build.gradle': '',
              'app/src/main/AndroidManifest.xml': '',
              'app/src/main/java/com/example/localstreamer/MainActivity.java': '',
              'app/src/main/java/com/example/localstreamer/StreamService.java': '',
              'app/src/main/res/layout/activity_main.xml': '',
              'README.md': '',
          }
          for path, encoded in files.items():
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "wb") as f:
                  f.write(base64.b64decode(encoded))
          print("Local Home Streamer v3.4.1 project generated")
          PY

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalStreamer-v3.4.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
