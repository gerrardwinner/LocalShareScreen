name: Build Local Web Streamer APK v3.1 (Android TV 9 Ready)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Local Streamer Project v3.1
        run: |
          python3 - << 'EOF'
          import os
          import textwrap

          files = {
              "settings.gradle": """
                  rootProject.name = "LocalStreamer"
                  include ':app'
              """,

              "build.gradle": """
                  buildscript {
                      repositories {
                          google()
                          mavenCentral()
                      }
                      dependencies {
                          classpath 'com.android.tools.build:gradle:8.1.4'
                      }
                  }
                  allprojects {
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }
              """,

              "gradle.properties": """
                  org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
                  android.useAndroidX=true
              """,

              "app/build.gradle": """
                  plugins {
                      id 'com.android.application'
                  }

                  android {
                      namespace 'com.example.localstreamer'
                      compileSdk 34

                      defaultConfig {
                          applicationId "com.example.localstreamer"
                          minSdk 26
                          targetSdk 34
                          versionCode 7
                          versionName "3.1"
                      }

                      buildTypes {
                          release {
                              minifyEnabled false
                          }
                      }
                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }

                  dependencies {
                      implementation 'org.nanohttpd:nanohttpd:2.3.1'
                  }
              """,

              "app/src/main/AndroidManifest.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
                      <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

                      <uses-feature android:name="android.software.leanback" android:required="false" />
                      <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
                      <uses-feature android:name="android.hardware.microphone" android:required="false" />

                      <application
                          android:allowBackup="true"
                          android:label="Local Streamer TV"
                          android:icon="@android:drawable/ic_menu_slideshow"
                          android:banner="@android:drawable/ic_menu_slideshow"
                          android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                          <activity
                              android:name=".MainActivity"
                              android:configChanges="orientation|screenSize|keyboardHidden"
                              android:exported="true">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                                  <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                              </intent-filter>
                          </activity>

                          <service
                              android:name=".StreamService"
                              android:enabled="true"
                              android:exported="false"
                              android:foregroundServiceType="mediaProjection" />

                      </application>
                  </manifest>
              """,

              "app/src/main/res/layout/activity_main.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:background="#121212"
                      android:gravity="center"
                      android:padding="24dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="📺 Local Home Streamer v3.1 (TV &amp; Mobile)"
                          android:textColor="#00e676"
                          android:textSize="22sp"
                          android:textStyle="bold"
                          android:paddingBottom="16dp" />

                      <TextView
                          android:id="@+id/tv_status"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="สถานะ: พร้อมแชร์ภาพและเสียง (รองรับ Android TV 9+)"
                          android:textColor="#e0e0e0"
                          android:textSize="15sp"
                          android:paddingBottom="30dp"
                          android:gravity="center" />

                      <Button
                          android:id="@+id/btn_toggle"
                          android:layout_width="320dp"
                          android:layout_height="65dp"
                          android:text="🚀 เริ่มแชร์หน้าจอ + เสียง (Start)"
                          android:backgroundTint="#00c853"
                          android:textColor="#ffffff"
                          android:textSize="16sp"
                          android:textStyle="bold"
                          android:focusable="true"
                          android:focusableInTouchMode="false" />

                  </LinearLayout>
              """,

              "app/src/main/java/com/example/localstreamer/MainActivity.java": """
                  package com.example.localstreamer;

                  import android.Manifest;
                  import android.app.Activity;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.content.pm.PackageManager;
                  import android.media.projection.MediaProjectionManager;
                  import android.net.ConnectivityManager;
                  import android.net.LinkAddress;
                  import android.net.LinkProperties;
                  import android.net.Network;
                  import android.net.wifi.WifiManager;
                  import android.os.Build;
                  import android.os.Bundle;
                  import android.text.format.Formatter;
                  import android.widget.Button;
                  import android.widget.TextView;
                  import android.widget.Toast;
                  import java.net.Inet4Address;
                  import java.net.InetAddress;

                  public class MainActivity extends Activity {
                      private static final int REQUEST_CODE = 1000;
                      private static final int PERM_AUDIO = 1001;
                      private TextView tvStatus;
                      private Button btnToggle;
                      private boolean isRunning = false;
                      private static final int PORT = 8080;
                      private MediaProjectionManager projectionManager;

                      @Override
                      protected void onCreate(Bundle savedInstanceState) {
                          super.onCreate(savedInstanceState);
                          setContentView(R.layout.activity_main);

                          tvStatus = findViewById(R.id.tv_status);
                          btnToggle = findViewById(R.id.btn_toggle);
                          btnToggle.requestFocus();

                          projectionManager = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, PERM_AUDIO);
                              }
                          }

                          btnToggle.setOnClickListener(v -> {
                              if (!isRunning) {
                                  startActivityForResult(projectionManager.createScreenCaptureIntent(), REQUEST_CODE);
                              } else {
                                  stopStreamService();
                              }
                          });
                      }

                      @Override
                      protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                          super.onActivityResult(requestCode, resultCode, data);
                          if (requestCode == REQUEST_CODE && resultCode == RESULT_OK && data != null) {
                              startStreamService(resultCode, data);
                          } else {
                              Toast.makeText(this, "ถูกปฏิเสธสิทธิ์การบันทึกหน้าจอ", Toast.LENGTH_SHORT).show();
                          }
                      }

                      private void startStreamService(int resultCode, Intent data) {
                          Intent serviceIntent = new Intent(this, StreamService.class);
                          serviceIntent.putExtra("resultCode", resultCode);
                          serviceIntent.putExtra("data", data);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent);
                          } else {
                              startService(serviceIntent);
                          }

                          isRunning = true;
                          String ipAddress = getLocalIpAddress();
                          String url = "http://" + ipAddress + ":" + PORT;
                          String audioNote = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) ?
                                  "(โหมดเสียงภายในระบบ)" : "(Android 9: โหมดดูดเสียงผ่านไมค์รีโมต/USB)";

                          tvStatus.setText("🟢 สตรีมเซิร์ฟเวอร์ทำงานแล้ว! " + audioNote + "\\n\\nเปิด Browser ที่เครื่องอื่นแล้วพิมพ์:\\n" + url);
                          btnToggle.setText("⏹️ หยุดการแชร์ (Stop)");
                          btnToggle.setBackgroundColor(android.graphics.Color.parseColor("#d32f2f"));
                      }

                      private void stopStreamService() {
                          Intent serviceIntent = new Intent(this, StreamService.class);
                          stopService(serviceIntent);
                          isRunning = false;

                          tvStatus.setText("สถานะ: ปิดการทำงานแล้ว");
                          btnToggle.setText("🚀 เริ่มแชร์หน้าจอ + เสียง (Start)");
                          btnToggle.setBackgroundColor(android.graphics.Color.parseColor("#00c853"));
                      }

                      private String getLocalIpAddress() {
                          try {
                              ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                              Network activeNetwork = cm.getActiveNetwork();
                              if (activeNetwork != null) {
                                  LinkProperties props = cm.getLinkProperties(activeNetwork);
                                  if (props != null) {
                                      for (LinkAddress addr : props.getLinkAddresses()) {
                                          InetAddress inet = addr.getAddress();
                                          if (!inet.isLoopbackAddress() && inet instanceof Inet4Address) {
                                              return inet.getHostAddress();
                                          }
                                      }
                                  }
                              }
                          } catch (Exception e) {}
                          WifiManager wifiManager = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                          return Formatter.formatIpAddress(wifiManager.getConnectionInfo().getIpAddress());
                      }
                  }
              """,

              "app/src/main/java/com/example/localstreamer/StreamService.java": """
                  package com.example.localstreamer;

                  import android.annotation.SuppressLint;
                  import android.app.Notification;
                  import android.app.NotificationChannel;
                  import android.app.NotificationManager;
                  import android.app.Service;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.content.pm.ServiceInfo;
                  import android.graphics.Bitmap;
                  import android.graphics.PixelFormat;
                  import android.hardware.display.DisplayManager;
                  import android.hardware.display.VirtualDisplay;
                  import android.media.AudioAttributes;
                  import android.media.AudioFormat;
                  import android.media.AudioPlaybackCaptureConfiguration;
                  import android.media.AudioRecord;
                  import android.media.Image;
                  import android.media.ImageReader;
                  import android.media.MediaRecorder;
                  import android.media.projection.MediaProjection;
                  import android.media.projection.MediaProjectionManager;
                  import android.os.Build;
                  import android.os.Handler;
                  import android.os.HandlerThread;
                  import android.os.IBinder;
                  import android.util.DisplayMetrics;
                  import android.view.WindowManager;

                  import java.io.ByteArrayInputStream;
                  import java.io.ByteArrayOutputStream;
                  import java.io.IOException;
                  import java.io.PipedInputStream;
                  import java.io.PipedOutputStream;
                  import java.nio.ByteBuffer;
                  import java.util.concurrent.CopyOnWriteArrayList;
                  import fi.iki.elonen.NanoHTTPD;

                  public class StreamService extends Service {
                      private MediaProjection mediaProjection;
                      private VirtualDisplay virtualDisplay;
                      private ImageReader imageReader;
                      private LocalWebServer webServer;
                      private HandlerThread handlerThread;
                      private Handler backgroundHandler;
                      private AudioRecord audioRecord;
                      private boolean isStreaming = false;

                      public static volatile byte[] latestJpeg = null;
                      private static final CopyOnWriteArrayList<PipedOutputStream> audioClients = new CopyOnWriteArrayList<>();

                      @Override
                      public void onCreate() {
                          super.onCreate();
                          handlerThread = new HandlerThread("ScreenCaptureThread");
                          handlerThread.start();
                          backgroundHandler = new Handler(handlerThread.getLooper());
                      }

                      @Override
                      public int onStartCommand(Intent intent, int flags, int startId) {
                          createNotificationChannel();
                          Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ?
                                  new Notification.Builder(this, "STREAM_CH") : new Notification.Builder(this);

                          Notification notification = builder
                                  .setContentTitle("Local Home Streamer v3.1")
                                  .setContentText("กำลังแชร์ภาพและเสียงผ่านเครือข่าย...")
                                  .setSmallIcon(android.R.drawable.ic_menu_slideshow)
                                  .build();

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                          } else {
                              startForeground(1, notification);
                          }

                          if (intent != null && intent.hasExtra("data")) {
                              int resultCode = intent.getIntExtra("resultCode", -1);
                              Intent data = intent.getParcelableExtra("data");
                              isStreaming = true;
                              startCapture(resultCode, data);
                              startServer();
                          }
                          return START_NOT_STICKY;
                      }

                      private void startCapture(int resultCode, Intent data) {
                          MediaProjectionManager pm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          mediaProjection = pm.getMediaProjection(resultCode, data);

                          mediaProjection.registerCallback(new MediaProjection.Callback() {
                              @Override
                              public void onStop() {
                                  stopSelf();
                              }
                          }, backgroundHandler);

                          WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                          DisplayMetrics metrics = new DisplayMetrics();
                          wm.getDefaultDisplay().getRealMetrics(metrics);

                          int width = 540;
                          int height = (int) (metrics.heightPixels * ((float) width / metrics.widthPixels));
                          if (metrics.widthPixels > metrics.heightPixels) {
                              // โหมดทีวีแนวนอน (16:9) ใช้ความละเอียด 854x480 เพื่อความลื่นไหลสูงสุดบนซีพียูทีวี
                              width = 854;
                              height = 480;
                          }
                          final int captureW = width;
                          final int captureH = height;

                          imageReader = ImageReader.newInstance(captureW, captureH, PixelFormat.RGBA_8888, 2);
                          virtualDisplay = mediaProjection.createVirtualDisplay("ScreenStream",
                                  captureW, captureH, metrics.densityDpi,
                                  DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                                  imageReader.getSurface(), null, backgroundHandler);

                          imageReader.setOnImageAvailableListener(reader -> {
                              Image image = null;
                              try {
                                  image = reader.acquireLatestImage();
                                  if (image != null) {
                                      Image.Plane[] planes = image.getPlanes();
                                      ByteBuffer buffer = planes[0].getBuffer();
                                      int pixelStride = planes[0].getPixelStride();
                                      int rowStride = planes[0].getRowStride();
                                      int rowPadding = rowStride - pixelStride * captureW;

                                      Bitmap bitmap = Bitmap.createBitmap(captureW + rowPadding / pixelStride, captureH, Bitmap.Config.ARGB_8888);
                                      bitmap.copyPixelsFromBuffer(buffer);
                                      Bitmap cropped = Bitmap.createBitmap(bitmap, 0, 0, captureW, captureH);

                                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                                      cropped.compress(Bitmap.CompressFormat.JPEG, 45, baos);
                                      latestJpeg = baos.toByteArray();

                                      cropped.recycle();
                                      bitmap.recycle();
                                  }
                              } catch (Exception e) {
                              } finally {
                                  if (image != null) {
                                      image.close();
                                  }
                              }
                          }, backgroundHandler);

                          startAudioCapture();
                      }

                      @SuppressLint("MissingPermission")
                      private void startAudioCapture() {
                          try {
                              int sampleRate = 44100;
                              int bufSize = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT) * 2;

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q && mediaProjection != null) {
                                  // Android 10+ ดึงเสียงภายในเครื่องโดยตรง
                                  AudioPlaybackCaptureConfiguration config = new AudioPlaybackCaptureConfiguration.Builder(mediaProjection)
                                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                                          .addMatchingUsage(AudioAttributes.USAGE_GAME)
                                          .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                                          .build();

                                  AudioFormat format = new AudioFormat.Builder()
                                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                          .setSampleRate(sampleRate)
                                          .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                                          .build();

                                  audioRecord = new AudioRecord.Builder()
                                          .setAudioFormat(format)
                                          .setBufferSizeInBytes(bufSize)
                                          .setAudioPlaybackCaptureConfig(config)
                                          .build();
                              } else {
                                  // Android 9 (TV) สลับไปใช้ไมโครโฟนดูดเสียงแทนอัตโนมัติ
                                  audioRecord = new AudioRecord(
                                          MediaRecorder.AudioSource.MIC,
                                          sampleRate,
                                          AudioFormat.CHANNEL_IN_MONO,
                                          AudioFormat.ENCODING_PCM_16BIT,
                                          bufSize);
                              }

                              if (audioRecord.getState() == AudioRecord.STATE_INITIALIZED) {
                                  audioRecord.startRecording();
                                  new Thread(() -> {
                                      byte[] buf = new byte[2048];
                                      while (isStreaming && audioRecord != null) {
                                          int read = audioRecord.read(buf, 0, buf.length);
                                          if (read > 0) {
                                              for (PipedOutputStream out : audioClients) {
                                                  try {
                                                      out.write(buf, 0, read);
                                                      out.flush();
                                                  } catch (IOException e) {
                                                      audioClients.remove(out);
                                                  }
                                              }
                                          }
                                      }
                                  }).start();
                              }
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }

                      private static byte[] createWavHeader(int sampleRate, int channels, int bitsPerSample) {
                          byte[] header = new byte[44];
                          long totalDataLen = 0x7fffffffL;
                          long byteRate = (long) sampleRate * channels * bitsPerSample / 8;
                          header[0] = 'R'; header[1] = 'I'; header[2] = 'F'; header[3] = 'F';
                          header[4] = (byte) (totalDataLen & 0xff);
                          header[5] = (byte) ((totalDataLen >> 8) & 0xff);
                          header[6] = (byte) ((totalDataLen >> 16) & 0xff);
                          header[7] = (byte) ((totalDataLen >> 24) & 0xff);
                          header[8] = 'W'; header[9] = 'A'; header[10] = 'V'; header[11] = 'E';
                          header[12] = 'f'; header[13] = 'm'; header[14] = 't'; header[15] = ' ';
                          header[16] = 16; header[17] = 0; header[18] = 0; header[19] = 0;
                          header[20] = 1; header[21] = 0;
                          header[22] = (byte) channels; header[23] = 0;
                          header[24] = (byte) (sampleRate & 0xff);
                          header[25] = (byte) ((sampleRate >> 8) & 0xff);
                          header[26] = (byte) ((sampleRate >> 16) & 0xff);
                          header[27] = (byte) ((sampleRate >> 24) & 0xff);
                          header[28] = (byte) (byteRate & 0xff);
                          header[29] = (byte) ((byteRate >> 8) & 0xff);
                          header[30] = (byte) ((byteRate >> 16) & 0xff);
                          header[31] = (byte) ((byteRate >> 24) & 0xff);
                          header[32] = (byte) (channels * bitsPerSample / 8);
                          header[33] = 0;
                          header[34] = (byte) bitsPerSample; header[35] = 0;
                          header[36] = 'd'; header[37] = 'a'; header[38] = 't'; header[39] = 'a';
                          header[40] = (byte) (totalDataLen & 0xff);
                          header[41] = (byte) ((totalDataLen >> 8) & 0xff);
                          header[42] = (byte) ((totalDataLen >> 16) & 0xff);
                          header[43] = (byte) ((totalDataLen >> 24) & 0xff);
                          return header;
                      }

                      private void startServer() {
                          try {
                              if (webServer == null) {
                                  webServer = new LocalWebServer(8080);
                                  webServer.start();
                              }
                          } catch (IOException e) {
                              e.printStackTrace();
                          }
                      }

                      private void createNotificationChannel() {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              NotificationChannel channel = new NotificationChannel(
                                      "STREAM_CH", "Stream Service", NotificationManager.IMPORTANCE_LOW);
                              NotificationManager manager = getSystemService(NotificationManager.class);
                              if (manager != null) manager.createNotificationChannel(channel);
                          }
                      }

                      @Override
                      public void onDestroy() {
                          super.onDestroy();
                          isStreaming = false;
                          audioClients.clear();
                          if (audioRecord != null) {
                              try { audioRecord.stop(); audioRecord.release(); } catch (Exception e) {}
                          }
                          if (webServer != null) webServer.stop();
                          if (virtualDisplay != null) virtualDisplay.release();
                          if (imageReader != null) imageReader.close();
                          if (mediaProjection != null) mediaProjection.stop();
                          if (handlerThread != null) handlerThread.quitSafely();
                      }

                      @Override
                      public IBinder onBind(Intent intent) {
                          return null;
                      }

                      private static class LocalWebServer extends NanoHTTPD {
                          public LocalWebServer(int port) {
                              super(port);
                          }

                          @Override
                          public Response serve(IHTTPSession session) {
                              String uri = session.getUri();
                              if ("/frame.jpg".equals(uri)) {
                                  byte[] frame = latestJpeg;
                                  if (frame == null || frame.length == 0) {
                                      return newFixedLengthResponse(Response.Status.SERVICE_UNAVAILABLE, "text/plain", "Waiting...");
                                  }
                                  Response res = newFixedLengthResponse(Response.Status.OK, "image/jpeg", new ByteArrayInputStream(frame), frame.length);
                                  res.addHeader("Cache-Control", "no-store, no-cache, must-revalidate, max-age=0");
                                  return res;
                              }

                              if ("/audio.wav".equals(uri)) {
                                  try {
                                      PipedInputStream in = new PipedInputStream(44100 * 2);
                                      PipedOutputStream out = new PipedOutputStream(in);
                                      out.write(createWavHeader(44100, 1, 16));
                                      out.flush();
                                      audioClients.add(out);
                                      Response res = newChunkedResponse(Response.Status.OK, "audio/wav", in);
                                      res.addHeader("Cache-Control", "no-store, no-cache");
                                      return res;
                                  } catch (IOException e) {
                                      return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, "text/plain", "Audio Error");
                                  }
                              }

                              String html = "<!DOCTYPE html><html><head><title>Home Streamer v3.1</title>" +
                                      "<meta name=\\"viewport\\" content=\\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\\">" +
                                      "<style>" +
                                      "body{background:#000;color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:0;overflow:hidden;}" +
                                      "#toolbar{position:fixed;top:10px;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:10px;transition:opacity 0.4s;}" +
                                      "button{background:rgba(0,200,83,0.9);color:#fff;border:none;padding:10px 18px;border-radius:24px;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.5);}" +
                                      "#container{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}" +
                                      "img{width:100%;height:100%;object-fit:contain;}" +
                                      "</style></head><body>" +
                                      "<div id=\\"toolbar\\">" +
                                      "  <button onclick=\\"toggleFull()\\">⛶ ขยายเต็มจอ</button>" +
                                      "  <button id=\\"audioBtn\\" onclick=\\"playAudio()\\">🔊 เปิดเสียง</button>" +
                                      "</div>" +
                                      "<div id=\\"container\\" onclick=\\"showBar()\\">" +
                                      "  <img id=\\"screen\\" src=\\"/frame.jpg\\" />" +
                                      "</div>" +
                                      "<audio id=\\"player\\"></audio>" +
                                      "<script>" +
                                      "const img = document.getElementById('screen');" +
                                      "const bar = document.getElementById('toolbar');" +
                                      "let barTimer;" +
                                      "function update() { img.src = '/frame.jpg?t=' + Date.now(); }" +
                                      "img.onload = () => requestAnimationFrame(update);" +
                                      "img.onerror = () => setTimeout(update, 300);" +
                                      "function toggleFull() {" +
                                      "  if (!document.fullscreenElement) {" +
                                      "    document.documentElement.requestFullscreen().catch(e => {});" +
                                      "  } else { document.exitFullscreen(); }" +
                                      "  hideBarLater();" +
                                      "}" +
                                      "function playAudio() {" +
                                      "  const p = document.getElementById('player');" +
                                      "  p.src = '/audio.wav?t=' + Date.now();" +
                                      "  p.play().then(() => {" +
                                      "    document.getElementById('audioBtn').innerText = '🟢 เสียงทำงานแล้ว';" +
                                      "    document.getElementById('audioBtn').style.background = '#2e7d32';" +
                                      "  }).catch(e => alert('กรุณาแตะปุ่มเปิดเสียงอีกครั้ง'));" +
                                      "  hideBarLater();" +
                                      "}" +
                                      "function showBar() { bar.style.opacity = '1'; hideBarLater(); }" +
                                      "function hideBarLater() { clearTimeout(barTimer); barTimer = setTimeout(() => bar.style.opacity = '0', 3500); }" +
                                      "hideBarLater();" +
                                      "</script></body></html>";
                              return newFixedLengthResponse(Response.Status.OK, "text/html; charset=utf-8", html);
                          }
                      }
                  }
              """
          }

          for path, content in files.items():
              full_path = os.path.join("LocalStreamerProject", path)
              os.makedirs(os.path.dirname(full_path), exist_ok=True)
              clean_content = textwrap.dedent(content).strip() + "\n"
              with open(full_path, "w", encoding="utf-8") as f:
                  f.write(clean_content)

          print("Local Streamer Project v3.1 generated successfully!")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and Run Gradle 8.4 Directly
        working-directory: ./LocalStreamerProject
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalStreamer-v3.1-APK
          path: LocalStreamerProject/app/build/outputs/apk/debug/app-debug.apk
