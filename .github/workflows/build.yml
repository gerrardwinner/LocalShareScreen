name: Build Local Web Streamer APK v3.5 (Single File)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project from this single workflow file
        run: |
          python3 - << 'PY'
          import os

          os.makedirs('app/src/main/java/com/example/localstreamer', exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)

          with open('settings.gradle', 'w') as f:
              f.write('''pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() } }
          rootProject.name = 'LocalStreamer'
          include ':app'
          ''')

          with open('build.gradle', 'w') as f:
              f.write('''plugins {
                  id 'com.android.application' version '8.1.4' apply false
              }
              ''')

          with open('gradle.properties', 'w') as f:
              f.write('''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          ''')

          with open('app/build.gradle', 'w') as f:
              f.write('''plugins { id 'com.android.application' }

          android {
              namespace 'com.example.localstreamer'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.localstreamer'
                  minSdk 26
                  targetSdk 34
                  versionCode 11
                  versionName '3.5'
              }

              buildTypes {
                  debug { }
                  release { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
          }
          ''')

          with open('app/src/main/AndroidManifest.xml', 'w') as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="Local Home Streamer 3.5"
                  android:usesCleartextTraffic="true"
                  android:icon="@android:drawable/ic_menu_slideshow"
                  android:banner="@android:drawable/ic_menu_slideshow"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".StreamService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|microphone" />
              </application>
          </manifest>
          ''')

          with open('app/src/main/java/com/example/localstreamer/MainActivity.java', 'w') as f:
              f.write('''package com.example.localstreamer;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.projection.MediaProjectionManager;
          import android.net.ConnectivityManager;
          import android.net.LinkAddress;
          import android.net.LinkProperties;
          import android.net.Network;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.format.Formatter;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.net.Inet4Address;
          import java.net.InetAddress;

          public class MainActivity extends Activity {
              private static final int REQUEST_CAPTURE = 1000;
              private static final int REQUEST_AUDIO = 1001;
              private TextView tvStatus;
              private Button btnToggle;
              private boolean running = false;
              private MediaProjectionManager projectionManager;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  tvStatus = findViewById(R.id.tv_status);
                  btnToggle = findViewById(R.id.btn_toggle);
                  projectionManager = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                  btnToggle.requestFocus();
                  btnToggle.setOnClickListener(v -> {
                      if (running) stopStreamer();
                      else requestAudioThenCapture();
                  });
              }

              private void requestAudioThenCapture() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQUEST_AUDIO);
                  } else {
                      requestCapturePermission();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQUEST_AUDIO) {
                      requestCapturePermission();
                  }
              }

              private void requestCapturePermission() {
                  if (projectionManager == null) {
                      Toast.makeText(this, "MediaProjectionManager ไม่พร้อมใช้งาน", Toast.LENGTH_LONG).show();
                      return;
                  }
                  startActivityForResult(projectionManager.createScreenCaptureIntent(), REQUEST_CAPTURE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQUEST_CAPTURE) {
                      if (resultCode == RESULT_OK && data != null) startStreamer(resultCode, data);
                      else Toast.makeText(this, "ผู้ใช้ปฏิเสธการแชร์หน้าจอ", Toast.LENGTH_SHORT).show();
                  }
              }

              private void startStreamer(int resultCode, Intent data) {
                  Intent service = new Intent(this, StreamService.class);
                  service.putExtra("resultCode", resultCode);
                  service.putExtra("projectionData", data);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(service);
                  else startService(service);

                  running = true;
                  String url = "http://" + getLocalIpAddress() + ":8080";
                  tvStatus.setText("สตรีมมิ่งหน้าจอฟรีแล้ว!\\n\\nเปิด Browser ไปที่ IP Wi-Fi:\\n" + url +
                          "\\n\\nAndroid 10+: เปิดหน้าเว็บเพื่อดูภาพ\\nAndroid 9: อาจต้องใช้ความช่วยเหลือ");
                  btnToggle.setText("หยุดสตรีมหน้าจอ");
              }

              private void stopStreamer() {
                  stopService(new Intent(this, StreamService.class));
                  running = false;
                  tvStatus.setText("หยุดสตรีมหน้าจอแล้ว");
                  btnToggle.setText("เริ่มสตรีมหน้าจอ");
              }

              private String getLocalIpAddress() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      Network network = cm.getActiveNetwork();
                      if (network != null) {
                          LinkProperties props = cm.getLinkProperties(network);
                          if (props != null) {
                              for (LinkAddress link : props.getLinkAddresses()) {
                                  InetAddress address = link.getAddress();
                                  if (address instanceof Inet4Address && !address.isLoopbackAddress())
                                      return address.getHostAddress();
                              }
                          }
                      }
                  } catch (Exception ignored) { }
                  try {
                      WifiManager wifi = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wifi != null) return Formatter.formatIpAddress(wifi.getConnectionInfo().getIpAddress());
                  } catch (Exception ignored) { }
                  return "127.0.0.1";
              }
          }
          ''')

          with open('app/src/main/java/com/example/localstreamer/StreamService.java', 'w') as f:
              f.write('''package com.example.localstreamer;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioPlaybackCaptureConfiguration;
          import android.media.AudioRecord;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.MediaRecorder;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;

          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.nio.ByteBuffer;
          import java.util.concurrent.CopyOnWriteArrayList;

          import fi.iki.elonen.NanoWSD;

          public class StreamService extends Service {
              private static volatile byte[] latestJpeg;
              private static final int PORT = 8080;
              private static final int SAMPLE_RATE = 44100;
              private static final int MAX_CAPTURE_EDGE = 1024;
              private final CopyOnWriteArrayList<NanoWSD.WebSocket> audioClients = new CopyOnWriteArrayList<>();
              private volatile boolean streaming = false;
              private volatile String audioMode = "กำลังเตรียมเสียง";
              private MediaProjection projection;
              private VirtualDisplay virtualDisplay;
              private ImageReader imageReader;
              private HandlerThread captureThread;
              private Handler captureHandler;
              private AudioRecord audioRecord;
              private LocalWebServer server;
              private Thread audioThread;
              private DisplayManager displayManager;
              private DisplayManager.DisplayListener displayListener;
              private volatile int captureWidth = 960;
              private volatile int captureHeight = 540;
              private volatile boolean audioRestartPending = false;
              private long audioPacketCount = 0;

              @Override
              public void onCreate() {
                  super.onCreate();
                  captureThread = new HandlerThread("LocalStreamer-Capture");
                  captureThread.start();
                  captureHandler = new Handler(captureThread.getLooper());
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  createNotificationChannel();
                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, "LOCAL_STREAM_CH")
                          : new Notification.Builder(this);
                  Notification notification = builder
                          .setContentTitle("Local Home Streamer 3.5")
                          .setContentText("กำลังสตรีมหน้าจอและเสียงผ่าน Wi-Fi")
                          .setSmallIcon(android.R.drawable.ic_menu_slideshow)
                          .setOngoing(true)
                          .build();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      int foregroundTypes = ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION;
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                          foregroundTypes |= ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE;
                      }
                      startForeground(7, notification, foregroundTypes);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(7, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(7, notification);
                  }

                  if (intent == null || !intent.hasExtra("projectionData")) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  int resultCode = intent.getIntExtra("resultCode", -1);
                  Intent data;
                  if (Build.VERSION.SDK_INT >= 33) data = intent.getParcelableExtra("projectionData", Intent.class);
                  else data = intent.getParcelableExtra("projectionData");

                  try {
                      startProjection(resultCode, data);
                      startWebServer();
                      streaming = true;
                      startAudioCapture();
                  } catch (Exception e) {
                      e.printStackTrace();
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              private void startProjection(int resultCode, Intent data) {
                  MediaProjectionManager manager = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                  projection = manager.getMediaProjection(resultCode, data);
                  if (projection == null) throw new IllegalStateException("MediaProjection unavailable");

                  projection.registerCallback(new MediaProjection.Callback() {
                      @Override public void onStop() { stopSelf(); }
                  }, captureHandler);

                  displayManager = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                  updateCaptureSurface(false);
                  displayListener = new DisplayManager.DisplayListener() {
                      @Override public void onDisplayAdded(int displayId) { }
                      @Override public void onDisplayRemoved(int displayId) { }
                      @Override
                      public void onDisplayChanged(int displayId) {
                          if (displayId == android.view.Display.DEFAULT_DISPLAY && captureHandler != null) {
                              captureHandler.removeCallbacks(resizeCaptureRunnable);
                              captureHandler.postDelayed(resizeCaptureRunnable, 350);
                          }
                      }
                  };
                  if (displayManager != null) displayManager.registerDisplayListener(displayListener, captureHandler);
              }

              private final Runnable resizeCaptureRunnable = () -> updateCaptureSurface(true);

              private void updateCaptureSurface(boolean allowResize) {
                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics metrics = new DisplayMetrics();
                  wm.getDefaultDisplay().getRealMetrics(metrics);
                  int sourceW = Math.max(2, metrics.widthPixels);
                  int sourceH = Math.max(2, metrics.heightPixels);
                  float scale = Math.min(1.0f, (float) MAX_CAPTURE_EDGE / Math.max(sourceW, sourceH));
                  int width = Math.max(2, ((int) (sourceW * scale)) & ~1);
                  int height = Math.max(2, ((int) (sourceH * scale)) & ~1);
                  if (allowResize && width == captureWidth && height == captureHeight) return;

                  captureWidth = width;
                  captureHeight = height;
                  ImageReader oldReader = imageReader;
                  ImageReader newReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 3);
                  if (virtualDisplay == null) {
                      virtualDisplay = projection.createVirtualDisplay(
                              "LocalStreamerScreen", width, height, metrics.densityDpi,
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                              newReader.getSurface(), null, captureHandler);
                  } else {
                      virtualDisplay.resize(width, height, metrics.densityDpi);
                      virtualDisplay.setSurface(newReader.getSurface());
                  }
                  imageReader = newReader;
                  newReader.setOnImageAvailableListener(reader -> {
                      Image image = null;
                      Bitmap padded = null;
                      Bitmap cropped = null;
                      try {
                          image = reader.acquireLatestImage();
                          if (image == null) return;
                          Image.Plane plane = image.getPlanes()[0];
                          ByteBuffer buffer = plane.getBuffer();
                          int pixelStride = plane.getPixelStride();
                          int rowStride = plane.getRowStride();
                          int rowPadding = rowStride - pixelStride * width;
                          int paddedWidth = width + rowPadding / pixelStride;
                          buffer.rewind();
                          padded = Bitmap.createBitmap(paddedWidth, height, Bitmap.Config.ARGB_8888);
                          padded.copyPixelsFromBuffer(buffer);
                          cropped = Bitmap.createBitmap(padded, 0, 0, width, height);
                          ByteArrayOutputStream output = new ByteArrayOutputStream(64 * 1024);
                          cropped.compress(Bitmap.CompressFormat.JPEG, 58, output);
                          latestJpeg = output.toByteArray();
                      } catch (Exception ignored) {
                      } finally {
                          if (cropped != null && cropped != padded) cropped.recycle();
                          if (padded != null) padded.recycle();
                          if (image != null) image.close();
                      }
                  }, captureHandler);
                  if (oldReader != null) oldReader.close();
              }

              @SuppressLint("MissingPermission")
              private void startAudioCapture() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      audioMode = "ไม่มีสิทธิ์ไมโครโฟน";
                      return;
                  }

                  int min = AudioRecord.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  if (min <= 0) min = 8192;
                  int bufferSize = Math.max(min * 2, 16384);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q && projection != null) {
                      try {
                          AudioPlaybackCaptureConfiguration config = new AudioPlaybackCaptureConfiguration.Builder(projection)
                                  .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                                  .addMatchingUsage(AudioAttributes.USAGE_GAME)
                                  .build();
                          AudioFormat format = new AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(SAMPLE_RATE)
                                  .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                                  .build();
                          audioRecord = new AudioRecord.Builder()
                                  .setAudioFormat(format)
                                  .setBufferSizeInBytes(bufferSize)
                                  .setAudioPlaybackCaptureConfig(config)
                                  .build();
                          audioRecord.startRecording();
                          if (audioRecord.getRecordingState() == AudioRecord.RECORDSTATE_RECORDING) {
                              audioMode = "สตรีมเสียงภายในระบบ";
                              startAudioPump();
                              return;
                          }
                      } catch (Exception ignored) {
                      }
                      releaseAudioRecord();
                  }
                  startMicrophoneCapture(bufferSize);
              }

              @SuppressLint("MissingPermission")
              private void startMicrophoneCapture(int requestedBufferSize) {
                  releaseAudioRecord();
                  try {
                      int bufferSize = Math.max(requestedBufferSize, 16384);
                      audioRecord = new AudioRecord(MediaRecorder.AudioSource.MIC, SAMPLE_RATE,
                              AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bufferSize);
                      if (audioRecord.getState() == AudioRecord.STATE_INITIALIZED) {
                          audioRecord.startRecording();
                          if (audioRecord.getRecordingState() == AudioRecord.RECORDSTATE_RECORDING) {
                              audioMode = "สตรีมเสียงผ่านไมโครโฟน";
                              startAudioPump();
                              return;
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  audioMode = "ไม่สามารถบันทึกเสียงได้";
                  releaseAudioRecord();
              }

              private void startAudioPump() {
                  if (audioThread != null && audioThread.isAlive()) return;
                  audioThread = new Thread(() -> {
                      android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_AUDIO);
                      byte[] buffer = new byte[2048];
                      boolean shouldRestart = false;
                      boolean fallbackToMic = false;
                      long lastAudibleAt = System.currentTimeMillis();

                      while (streaming) {
                          AudioRecord recorder = audioRecord;
                          if (recorder == null) {
                              shouldRestart = true;
                              fallbackToMic = audioMode.equals("สตรีมเสียงภายในระบบ");
                              break;
                          }

                          int count;
                          try {
                              count = recorder.read(buffer, 0, buffer.length, AudioRecord.READ_BLOCKING);
                          } catch (Exception e) {
                              count = AudioRecord.ERROR_INVALID_OPERATION;
                          }

                          if (count > 0) {
                              if (audioMode.equals("สตรีมเสียงภายในระบบ")) {
                                  boolean audible = false;
                                  int peak = 0;
                                  for (int i = 0; i + 1 < count; i += 2) {
                                      int sample = (short) ((buffer[i] & 0xff) | (buffer[i + 1] << 8));
                                      int magnitude = Math.abs(sample);
                                      if (magnitude > peak) peak = magnitude;
                                      if (magnitude > 100) audible = true;
                                  }
                                  if (audible) {
                                      lastAudibleAt = System.currentTimeMillis();
                                  } else if (System.currentTimeMillis() - lastAudibleAt > 3500) {
                                      fallbackToMic = true;
                                      shouldRestart = true;
                                      break;
                                  }
                              }

                              byte[] packet = new byte[count];
                              System.arraycopy(buffer, 0, packet, 0, count);
                              for (NanoWSD.WebSocket client : audioClients) {
                                  try {
                                      client.send(packet);
                                      audioPacketCount++;
                                  } catch (IOException | RuntimeException e) {
                                      audioClients.remove(client);
                                  }
                              }
                          } else if (count == AudioRecord.ERROR_DEAD_OBJECT ||
                                  count == AudioRecord.ERROR_INVALID_OPERATION ||
                                  count == AudioRecord.ERROR_BAD_VALUE || count < 0) {
                              shouldRestart = true;
                              fallbackToMic = audioMode.equals("สตรีมเสียงภายในระบบ");
                              break;
                          }
                      }

                      if (shouldRestart && streaming && !audioRestartPending && captureHandler != null) {
                          audioRestartPending = true;
                          boolean useMicFallback = fallbackToMic;
                          captureHandler.postDelayed(() -> {
                              audioRestartPending = false;
                              if (!streaming) return;
                              releaseAudioRecord();
                              if (useMicFallback) {
                                  int min = AudioRecord.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                                  startMicrophoneCapture(min > 0 ? Math.max(min * 2, 16384) : 16384);
                              } else {
                                  startAudioCapture();
                              }
                          }, 250);
                      }
                  }, "LocalStreamer-Audio");
                  audioThread.start();
              }

              private void releaseAudioRecord() {
                  if (audioRecord != null) {
                      try { if (audioRecord.getRecordingState() == AudioRecord.RECORDSTATE_RECORDING) audioRecord.stop(); } catch (Exception ignored) { }
                      try { audioRecord.release(); } catch (Exception ignored) { }
                      audioRecord = null;
                  }
              }

              private void startWebServer() throws IOException {
                  if (server == null) {
                      server = new LocalWebServer(PORT);
                      server.start(5000, false);
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("LOCAL_STREAM_CH", "Local Streamer", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  streaming = false;
                  audioClients.clear();
                  releaseAudioRecord();
                  if (displayManager != null && displayListener != null) {
                      try { displayManager.unregisterDisplayListener(displayListener); } catch (Exception ignored) { }
                  }
                  if (server != null) { server.stop(); server = null; }
                  if (virtualDisplay != null) { virtualDisplay.release(); virtualDisplay = null; }
                  if (imageReader != null) { imageReader.close(); imageReader = null; }
                  if (projection != null) { projection.stop(); projection = null; }
                  if (captureThread != null) captureThread.quitSafely();
                  latestJpeg = null;
                  super.onDestroy();
              }

              @Override public IBinder onBind(Intent intent) { return null; }

              private class LocalWebServer extends NanoWSD {
                  LocalWebServer(int port) { super(port); }

                  @Override
                  protected NanoWSD.WebSocket openWebSocket(IHTTPSession handshake) {
                      return new NanoWSD.WebSocket(handshake) {
                          @Override protected void onOpen() { audioClients.add(this); }
                          @Override protected void onClose(NanoWSD.WebSocketFrame.CloseCode code, String reason, boolean initiatedByRemote) { audioClients.remove(this); }
                          @Override protected void onMessage(NanoWSD.WebSocketFrame message) { }
                          @Override protected void onPong(NanoWSD.WebSocketFrame pong) { }
                          @Override protected void onException(IOException exception) { audioClients.remove(this); }
                      };
                  }

                  @Override
                  public Response serve(IHTTPSession session) {
                      if (isWebsocketRequested(session)) return super.serve(session);
                      String uri = session.getUri();
                      if ("/frame.jpg".equals(uri)) {
                          byte[] frame = latestJpeg;
                          if (frame == null) return newFixedLengthResponse(Response.Status.SERVICE_UNAVAILABLE, "text/plain", "Waiting for first frame");
                          Response response = newFixedLengthResponse(Response.Status.OK, "image/jpeg", new ByteArrayInputStream(frame), frame.length);
                          response.addHeader("Cache-Control", "no-store, no-cache, must-revalidate, max-age=0");
                          return response;
                      }
                      if ("/status".equals(uri)) {
                          String json = "{\\"streaming\\":true,\\"audio\\":\\"" + audioMode + "\\",\\"width\\":" + captureWidth + ",\\"height\\":\\"" + captureHeight + "\",\\"sampleRate\\":" + SAMPLE_RATE + ",\\"audioPackets\\":" + audioPacketCount + "}";
                          return newFixedLengthResponse(Response.Status.OK, "application/json; charset=utf-8", json);
                      }
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=utf-8", pageHtml());
                  }
              }

              private String pageHtml() {
                  return "<!DOCTYPE html><html lang=\\"th\\"><head><meta charset=\\"utf-8\\"><meta name=\\"viewport\\" content=\\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\\"><meta name=\\"apple-mobile-web-app-capable\\" content=\\"yes\\"><meta name=\\"apple-mobile-web-app-status-bar-style\\" content=\\"black-translucent\\"><meta name=\\"theme-color\\" content=\\"#000000\\"><title>Local Home Streamer 3.5</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{position:fixed;inset:0;touch-action:manipulation}#stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}#screen{display:block;width:100%;height:100%;object-fit:cover;background:#000}body.orientation-mismatch #screen{object-fit:contain}#bar{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:0 8px;transition:opacity .25s}button{border:0;border-radius:24px;padding:11px 16px;background:rgba(0,190,80,.94);color:white;font-size:14px;font-weight:700;box-shadow:0 2px 8px #0008}#hint{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ddd;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none;padding:0 12px}body.clean #bar,body.clean #hint{opacity:0;pointer-events:none}#status{font-size:12px;color:#fff;align-self:center;text-shadow:0 1px 4px #000;max-width:90vw;text-align:center}body.pseudo-fullscreen #stage{inset:0;width:100vw;height:100vh;height:100dvh}</style></head><body><main id=\\"stage\\"><img id=\\"screen\\" alt=\\"Live screen stream\\" draggable=\\"false\\"></main><nav id=\\"bar\\"><button id=\\"fullBtn\\" type=\\"button\\">⛶ ขยาย / ย่อจอ</button><button id=\\"audioBtn\\" type=\\"button\\">🔊 เปิดเสียง</button><span id=\\"status\\">กำลังโหลด...</span></nav><div id=\\"hint\\">แตะเพื่อซ่อน/แสดงเมนู | iOS: แตะปุ่มเปิดเสียงก่อน</div><script>const img=document.getElementById('screen');const statusEl=document.getElementById('status');let hideTimer=null,sourceW=960,sourceH=540,frameBusy=false,frameTimer=null;let audioCtx=null,audioGain=null,socket=null,audioWanted=false,retryTimer=null,nextAudioTime=0;let lastPacketAt=0;function refreshFrame(){if(frameBusy)return;frameBusy=true;img.src='/frame.jpg?t='+Date.now()}img.onload=()=>{frameBusy=false;clearTimeout(frameTimer);frameTimer=setTimeout(refreshFrame,50)};img.onerror=()=>{frameBusy=false;clearTimeout(frameTimer);frameTimer=setTimeout(refreshFrame,180)};refreshFrame();function showControls(){document.body.classList.remove('clean');clearTimeout(hideTimer);hideTimer=setTimeout(()=>document.body.classList.add('clean'),4500)}document.addEventListener('pointerdown',showControls,{passive:true});showControls();function applyOrientation(){const sourceLandscape=sourceW>=sourceH;const receiverLandscape=window.innerWidth>=window.innerHeight;const mismatch=sourceLandscape!==receiverLandscape;document.body.classList.toggle('orientation-mismatch',mismatch)}window.addEventListener('resize',applyOrientation);window.addEventListener('orientationchange',()=>setTimeout(applyOrientation,300));async function updateStatus(){try{const s=await fetch('/status',{cache:'no-store'}).then(r=>r.json());sourceW=s.width||sourceW;sourceH=s.height||sourceH;applyOrientation();if(!document.body.classList.contains('orientation-mismatch')){statusEl.textContent='หน้าจอ '+sourceW+'x'+sourceH+' | '+s.audio+' | (เสียง: '+s.audioPackets+')'}}catch(e){statusEl.textContent='กำลังเชื่อมต่อเซิร์ฟเวอร์...'}}updateStatus();setInterval(updateStatus,2500);async function toggleFullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else if(document.fullscreenElement){await document.exitFullscreen()}else{document.body.classList.toggle('pseudo-fullscreen')}if(document.fullscreenElement&&screen.orientation&&screen.orientation.lock){await screen.orientation.lock(sourceW>=sourceH?'landscape':'portrait').catch(()=>{})}}catch(e){document.body.classList.toggle('pseudo-fullscreen')}applyOrientation();showControls()}document.getElementById('fullBtn').addEventListener('click',toggleFullscreen);function connectAudioSocket(){if(!audioWanted||(socket&&socket.readyState<=1))return;const scheme=location.protocol==='https:'?'wss:':'ws:';try{socket=new WebSocket(scheme+location.host+'/audio');socket.binaryType='arraybuffer'}catch(e){scheduleReconnect();return}socket.onopen=()=>{nextAudioTime=0;statusEl.textContent='เชื่อมต่อเสียงสำเร็จ'};socket.onmessage=e=>{if(!(e.data instanceof ArrayBuffer)||!audioCtx||!audioGain)return;const count=e.data.byteLength>>1;if(!count)return;lastPacketAt=Date.now();const view=new DataView(e.data),raw=new Float32Array(count);for(let i=0;i<count;i++)raw[i]=view.getInt16(i*2,true)/32768;const targetRate=audioCtx.sampleRate;let samples=raw;if(targetRate!==44100){const n=Math.max(1,Math.round(count*targetRate/44100));samples=new Float32Array(n);const step=44100/targetRate;for(let i=0;i<n;i++){const pos=i*step,lo=Math.min(count-1,Math.floor(pos));const hi=Math.min(count-1,lo+1),frac=pos-lo;samples[i]=raw[lo]*(1-frac)+raw[hi]*frac}}const buffer=audioCtx.createBuffer(1,samples.length,targetRate);buffer.copyToChannel(samples,0);const node=audioCtx.createBufferSource();node.buffer=buffer;node.connect(audioGain);const now=audioCtx.currentTime;if(nextAudioTime<now+0.035||nextAudioTime>now+0.30)nextAudioTime=now+0.055;node.start(nextAudioTime);nextAudioTime+=buffer.duration;node.onended=()=>{try{node.disconnect()}catch(e){}};};socket.onerror=()=>{statusEl.textContent='เกิดข้อผิดพลาดในการเชื่อมต่อเสียง'};socket.onclose=()=>{socket=null;nextAudioTime=0;if(audioWanted)scheduleReconnect()};}function scheduleReconnect(){if(!audioWanted||retryTimer)return;retryTimer=setTimeout(()=>{retryTimer=null;connectAudioSocket()},1200)}async function startAudio(){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx){statusEl.textContent='เบราว์เซอร์ไม่รองรับ Web Audio';return}try{audioCtx=audioCtx||new AudioCtx({latencyHint:'interactive'});await audioCtx.resume();if(!audioGain){audioGain=audioCtx.createGain();audioGain.gain.value=1.0;audioGain.connect(audioCtx.destination)}audioWanted=true;lastPacketAt=0;nextAudioTime=0;connectAudioSocket();document.getElementById('audioBtn').textContent='🔊 ปิดเสียง';showControls()}catch(e){statusEl.textContent='ไม่สามารถเปิดเสียงได้: '+e.message}}function stopAudio(){audioWanted=false;clearTimeout(retryTimer);retryTimer=null;nextAudioTime=0;if(socket){try{socket.close()}catch(e){}socket=null}document.getElementById('audioBtn').textContent='🔊 เปิดเสียง'}document.getElementById('audioBtn').addEventListener('click',()=>{if(audioWanted)stopAudio();else startAudio();showControls()});setInterval(()=>{if(audioWanted&&lastPacketAt&&Date.now()-lastPacketAt>2500){statusEl.textContent='เชื่อมต่อแล้ว (รอรับข้อมูลเสียง...)';}},1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audioWanted){if(audioCtx)audioCtx.resume().catch(()=>{});if(!socket||socket.readyState>1)connectAudioSocket()}});window.addEventListener('online',()=>{if(audioWanted)connectAudioSocket()});</script></body></html>''')
          print('Local Home Streamer v3.5 project generated successfully')
          PY

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalStreamer-v3.5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
