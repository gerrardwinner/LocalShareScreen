name: Build Local Web Streamer APK v2.1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Local Streamer Project v2.1
        run: |
          python3 - << 'EOF'
          import os
          import textwrap

          files = {
              "settings.gradle": """
                  rootProject.name = "LocalStreamer"
                  include ':app'
              """,

              "build.gradle": """
                  buildscript {
                      repositories {
                          google()
                          mavenCentral()
                      }
                      dependencies {
                          classpath 'com.android.tools.build:gradle:8.1.4'
                      }
                  }
                  allprojects {
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }
              """,

              "gradle.properties": """
                  org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
                  android.useAndroidX=true
              """,

              "app/build.gradle": """
                  plugins {
                      id 'com.android.application'
                  }

                  android {
                      namespace 'com.example.localstreamer'
                      compileSdk 34

                      defaultConfig {
                          applicationId "com.example.localstreamer"
                          minSdk 26
                          targetSdk 34
                          versionCode 3
                          versionName "2.1"
                      }

                      buildTypes {
                          release {
                              minifyEnabled false
                          }
                      }
                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }

                  dependencies {
                      implementation 'org.nanohttpd:nanohttpd:2.3.1'
                  }
              """,

              "app/src/main/AndroidManifest.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
                      <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

                      <application
                          android:allowBackup="true"
                          android:label="Local Streamer"
                          android:icon="@android:drawable/ic_menu_slideshow"
                          android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                          <activity
                              android:name=".MainActivity"
                              android:exported="true">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                          </activity>

                      </application>
                  </manifest>
              """,

              "app/src/main/res/layout/activity_main.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:background="#121212"
                      android:gravity="center"
                      android:padding="24dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="🏠 Local Home Streamer v2.1"
                          android:textColor="#00e676"
                          android:textSize="22sp"
                          android:textStyle="bold"
                          android:paddingBottom="16dp" />

                      <TextView
                          android:id="@+id/tv_status"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="สถานะ: พร้อมเริ่มเปิดเซิร์ฟเวอร์สตรีมภาพ"
                          android:textColor="#e0e0e0"
                          android:textSize="14sp"
                          android:paddingBottom="30dp"
                          android:gravity="center" />

                      <Button
                          android:id="@+id/btn_toggle"
                          android:layout_width="match_parent"
                          android:layout_height="60dp"
                          android:text="🚀 เริ่มแชร์หน้าจอสด (Start Server)"
                          android:backgroundTint="#00c853"
                          android:textColor="#ffffff"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                  </LinearLayout>
              """,

              "app/src/main/java/com/example/localstreamer/MainActivity.java": """
                  package com.example.localstreamer;

                  import android.app.Activity;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.graphics.Bitmap;
                  import android.graphics.PixelFormat;
                  import android.hardware.display.DisplayManager;
                  import android.hardware.display.VirtualDisplay;
                  import android.media.Image;
                  import android.media.ImageReader;
                  import android.media.projection.MediaProjection;
                  import android.media.projection.MediaProjectionManager;
                  import android.net.wifi.WifiManager;
                  import android.os.Bundle;
                  import android.os.Handler;
                  import android.os.Looper;
                  import android.text.format.Formatter;
                  import android.widget.Button;
                  import android.widget.TextView;
                  import android.widget.Toast;

                  import java.io.ByteArrayOutputStream;
                  import java.io.IOException;
                  import java.nio.ByteBuffer;
                  import fi.iki.elonen.NanoHTTPD;

                  public class MainActivity extends Activity {
                      private static final int REQUEST_CODE = 1000;
                      private TextView tvStatus;
                      private Button btnToggle;
                      private LocalWebServer webServer;
                      private boolean isRunning = false;
                      private static final int PORT = 8080;

                      private MediaProjectionManager projectionManager;
                      private MediaProjection mediaProjection;
                      private VirtualDisplay virtualDisplay;
                      private ImageReader imageReader;
                      private static byte[] latestJpeg = null;

                      @Override
                      protected void onCreate(Bundle savedInstanceState) {
                          super.onCreate(savedInstanceState);
                          setContentView(R.layout.activity_main);

                          tvStatus = findViewById(R.id.tv_status);
                          btnToggle = findViewById(R.id.btn_toggle);

                          projectionManager = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);

                          btnToggle.setOnClickListener(v -> {
                              if (!isRunning) {
                                  startActivityForResult(projectionManager.createScreenCaptureIntent(), REQUEST_CODE);
                              } else {
                                  stopServer();
                              }
                          });
                      }

                      @Override
                      protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                          super.onActivityResult(requestCode, resultCode, data);
                          if (requestCode == REQUEST_CODE && resultCode == RESULT_OK) {
                              mediaProjection = projectionManager.getMediaProjection(resultCode, data);
                              startVirtualDisplay();
                              startServer();
                          } else {
                              Toast.makeText(this, "ถูกปฏิเสธสิทธิ์การบันทึกหน้าจอ", Toast.LENGTH_SHORT).show();
                          }
                      }

                      private void startVirtualDisplay() {
                          int width = 720;
                          int height = 1280;
                          imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2);
                          virtualDisplay = mediaProjection.createVirtualDisplay("ScreenCapture",
                                  width, height, getResources().getDisplayMetrics().densityDpi,
                                  DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                                  imageReader.getSurface(), null, null);

                          imageReader.setOnImageAvailableListener(reader -> {
                              Image image = reader.acquireLatestImage();
                              if (image != null) {
                                  Image.Plane[] planes = image.getPlanes();
                                  ByteBuffer buffer = planes[0].getBuffer();
                                  int pixelStride = planes[0].getPixelStride();
                                  int rowStride = planes[0].getRowStride();
                                  int rowPadding = rowStride - pixelStride * image.getWidth();

                                  Bitmap bitmap = Bitmap.createBitmap(image.getWidth() + rowPadding / pixelStride, image.getHeight(), Bitmap.Config.ARGB_8888);
                                  bitmap.copyPixelsFromBuffer(buffer);
                                  image.close();

                                  ByteArrayOutputStream baos = new ByteArrayOutputStream();
                                  bitmap.compress(Bitmap.CompressFormat.JPEG, 50, baos);
                                  latestJpeg = baos.toByteArray();
                              }
                          }, new Handler(Looper.getMainLooper()));
                      }

                      private void startServer() {
                          try {
                              webServer = new LocalWebServer(PORT);
                              webServer.start();
                              isRunning = true;

                              String ipAddress = getLocalIpAddress();
                              String url = "http://" + ipAddress + ":" + PORT;

                              tvStatus.setText("🟢 สตรีมเซิร์ฟเวอร์ทำงานแล้ว!\\n\\nเปิด Browser ที่เครื่องอื่นแล้วพิมพ์:\\n" + url);
                              btnToggle.setText("⏹️ หยุดการแชร์ (Stop)");
                              btnToggle.setBackgroundColor(android.graphics.Color.parseColor("#d32f2f"));

                          } catch (IOException e) {
                              e.printStackTrace();
                              tvStatus.setText("❌ เปิดเซิร์ฟเวอร์ไม่สำเร็จ: " + e.getMessage());
                          }
                      }

                      private void stopServer() {
                          if (webServer != null) {
                              webServer.stop();
                              webServer = null;
                          }
                          if (virtualDisplay != null) { virtualDisplay.release(); }
                          if (mediaProjection != null) { mediaProjection.stop(); }
                          isRunning = false;

                          tvStatus.setText("สถานะ: ปิดการทำงานแล้ว");
                          btnToggle.setText("🚀 เริ่มแชร์หน้าจอสด (Start Server)");
                          btnToggle.setBackgroundColor(android.graphics.Color.parseColor("#00c853"));
                      }

                      private String getLocalIpAddress() {
                          WifiManager wifiManager = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                          return Formatter.formatIpAddress(wifiManager.getConnectionInfo().getIpAddress());
                      }

                      private static class LocalWebServer extends NanoHTTPD {
                          public LocalWebServer(int port) {
                              super(port);
                          }

                          @Override
                          public Response serve(IHTTPSession session) {
                              String uri = session.getUri();
                              if ("/stream".equals(uri)) {
                                  return new ChunkedResponse();
                              }

                              String html = "<Html><head><title>Home Streamer</title>" +
                                      "<meta name=\\"viewport\\" content=\\"width=device-width, initial-scale=1.0\\">" +
                                      "<style>body{background:#111;color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:20px;}" +
                                      "h2{color:#00e676;margin:5px;}" +
                                      "img{max-width:100%;height:auto;border:2px solid #00e676;border-radius:8px;margin-top:10px;}</style>" +
                                      "</head><body>" +
                                      "<h2>🏠 Home Screen Stream</h2>" +
                                      "<p style=\\"color:#aaa;font-size:12px;\\">ถ่ายทอดสดหน้าจอแบบเรียลไทม์ภายในบ้าน</p>" +
                                      "<img src=\\"/stream\\" />" +
                                      "</body></html>";
                              return newFixedLengthResponse(Response.Status.OK, "text/html", html);
                          }
                      }

                      private static class ChunkedResponse extends NanoHTTPD.Response {
                          public ChunkedResponse() {
                              super(NanoHTTPD.Status.OK, "multipart/x-mixed-replace; boundary=frame", null);
                          }

                          @Override
                          protected void send(java.io.OutputStream outputStream) {
                              try {
                                  while (latestJpeg != null) {
                                      if (latestJpeg.length > 0) {
                                          String header = "--frame\\r\\nContent-Type: image/jpeg\\r\\nContent-Length: " + latestJpeg.length + "\\r\\n\\r\\n";
                                          outputStream.write(header.getBytes());
                                          outputStream.write(latestJpeg);
                                          outputStream.write("\\r\\n".getBytes());
                                          outputStream.flush();
                                      }
                                      Thread.sleep(100);
                                  }
                              } catch (Exception e) {
                              }
                          }
                      }

                      @Override
                      protected void onDestroy() {
                          super.onDestroy();
                          stopServer();
                      }
                  }
              """
          }

          for path, content in files.items():
              full_path = os.path.join("LocalStreamerProject", path)
              os.makedirs(os.path.dirname(full_path), exist_ok=True)
              clean_content = textwrap.dedent(content).strip() + "\n"
              with open(full_path, "w", encoding="utf-8") as f:
                  f.write(clean_content)

          print("Local Streamer Project v2.1 generated successfully!")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        working-directory: ./LocalStreamerProject
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalStreamer-v2.1-APK
          path: LocalStreamerProject/app/build/outputs/apk/debug/app-debug.apk
